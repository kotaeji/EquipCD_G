name: PR label

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  pull-requests: write
  issues: write

jobs:
  label:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // 새 커밋이 오면 검토 결과 라벨을 내리고 다시 검토 대기로 돌린다 (AGENTS.md 4절)
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            for (const name of ['review:ok', 'review:changes']) {
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number, name }); } catch (e) {}
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['review:needed'] });
