name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Release HTML must not change in TURN PRs
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'turn/')
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -q '^release/'; then
            echo "::error::TURN PR이 release/ 를 바꿨습니다. AGENTS.md 7절 — 릴리스 HTML은 머지 후 한 번만 갱신합니다."
            exit 1
          fi
